# pnpm 11 refuses to run any dependency's install scripts until each is listed
# here. An unlisted one fails the install outright, so this file is a decision
# log, not configuration noise.

allowBuilds:
  # Generated by create-next-app. Neither is used: no image pipeline needs
  # sharp yet, and unrs-resolver is an eslint transitive.
  sharp: false
  unrs-resolver: false

  # msw is NOT a dependency of this project any more. It was removed on
  # 2026-08-15, when four real route handlers under src/app/api/ replaced the
  # mock so the client could open a deployed link. It reappears in the lockfile
  # only because `@vitest/mocker` declares it as an OPTIONAL peer and pnpm
  # resolves it anyway; nothing imports it, and the ESLint ban on the package
  # makes sure nothing can.
  #
  # `false`, not deleted: an unlisted package that HAS an install script fails
  # the whole install, so this line is what keeps `pnpm install` green while
  # refusing the postinstall itself. That script re-runs `msw init`, which would
  # copy mockServiceWorker.js back into public/ — the exact file this change set
  # removed, and the exact way a retired mock comes back to life.
  msw: false
