# pnpm 11 refuses to run any dependency's install scripts until each is listed
# here. An unlisted one fails the install outright, so this file is a decision
# log, not configuration noise.

allowBuilds:
  # Generated by create-next-app. Neither is used: no image pipeline needs
  # sharp yet, and unrs-resolver is an eslint transitive.
  sharp: false
  unrs-resolver: false

  # msw is NOT a dependency of this project any more. It was removed on
  # 2026-08-15, when four real route handlers under src/app/api/ replaced the
  # mock so the client could open a deployed link. It reappears in the lockfile
  # only because `@vitest/mocker` declares it as an OPTIONAL peer and pnpm
  # resolves it anyway; nothing imports it, and the ESLint ban on the package
  # makes sure nothing can.
  #
  # `false`, not deleted: an unlisted package that HAS an install script fails
  # the whole install, so this line is what keeps `pnpm install` green while
  # refusing the postinstall itself. That script re-runs `msw init`, which would
  # copy mockServiceWorker.js back into public/ — the exact file this change set
  # removed, and the exact way a retired mock comes back to life.
  msw: false

# Real, flat node_modules instead of pnpm's symlink farm.
#
# Hostinger's hbuilds deploy copies node_modules into the release directory and
# does not preserve symlinks. With the default linker, `node_modules/next`
# arrives as a real folder while next's own dependencies stay behind in
# `.pnpm/next@16.3.0_.../node_modules/`, so the first server request dies with
#   Cannot find module '@swc/helpers/_/_interop_require_default'
# and every other next dependency (@next/env, styled-jsx, postcss) is one fix
# away from the same failure. Hoisting is what makes the tree survive the copy.
#
# pnpm 11 reads this key from here, not from .npmrc — the `node-linker` line in
# .npmrc is kept only in case the host runs an older pnpm.
nodeLinker: hoisted

# sharp is next's optional dependency for /image optimization — nothing here
# imports it directly, which is why it is not in package.json.
#
# CVE-2026-84383: sharp below 0.35.4 bundles libheif 1.23.x, whose AVIF decoder
# has two CVSSv3-critical RCE bugs reachable from untrusted image input. This
# app takes exactly that input — the payment-proof upload on /booking — so the
# "not processing untrusted images" escape hatch does not apply.
#
# A range, not an exact pin, unlike package.json: this override exists to stay
# ahead of a decoder CVE, and pinning 0.35.4 would block the next patch too.
overrides:
  sharp: ">=0.35.4"
  # CVE-2026-84375: js-yaml below 4.3.2 does not count empty mappings against
  # maxTotalMergeKeys, so a ~50 KB document with repeated merges of a sequence
  # of empty mappings burns O(N*K) CPU. Merge is on by default in v4, which is
  # why the 4.x line scores higher than v5.
  #
  # Reached only through the eslint toolchain, so the exposure is a lint run
  # over a hostile config, not a request path.
  #
  # Upper bound, not a bare `>=`: an open range let pnpm resolve 5.4.1 here and
  # nanoid 6.0.1 below — a security override silently performing two major
  # upgrades, which is a different change than the one being asked for. Bounded
  # to the major eslint and postcss already expect, so patches still flow.
  js-yaml: ">=4.3.2 <5"

  # nanoid below 3.3.18 loops forever when a custom generator is called with
  # size zero. This one is NOT dev-only — it arrives through next and
  # @tailwindcss/postcss, both of which ship, so it belongs in the same commit
  # class as a runtime dependency rather than a tooling one.
  nanoid: ">=3.3.18 <4"
