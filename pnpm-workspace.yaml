# pnpm 11 refuses to run any dependency's install scripts until each is listed
# here. An unlisted one fails the install outright, so this file is a decision
# log, not configuration noise.

allowBuilds:
  # Generated by create-next-app. Neither is used: no image pipeline needs
  # sharp yet, and unrs-resolver is an eslint transitive.
  sharp: false
  unrs-resolver: false

  # Read before allowing (node_modules/msw/config/scripts/postinstall.js): it
  # returns immediately unless package.json declares "msw.workerDirectory". When
  # that key exists it re-runs `msw init`, re-copying mockServiceWorker.js so the
  # worker in public/ cannot drift from the installed msw version.
  #
  # Allowed because that is a stale-copy guard, and a worker script that silently
  # lags its library is exactly this project's recurring defect shape.
  #
  # It does NOT weaken the production rule. That rule is about *registration* —
  # a stray worker intercepting real requests and serving fake availability with
  # no error. Gating registration on NODE_ENV is step 07; confirming the file is
  # absent from the production build is Phase 4.
  msw: true
